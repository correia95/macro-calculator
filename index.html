    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Macro Calculator",
        "url": "https://macro-calculator.correia95.workers.dev/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Estimates daily protein, carbohydrate and fat targets by splitting a calorie goal (entered directly or computed from the Mifflin-St Jeor equation, activity level and a weight goal) using a preset, custom or protein-per-kilogram macronutrient ratio, with per-meal figures. An estimate, not medical or dietary advice."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I calculate my macros?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Start from a daily calorie target. Multiply it by the percentage you want from each macronutrient, then divide by its energy density: 4 calories per gram for protein and carbohydrate, 9 for fat."
            }
          },
          {
            "@type": "Question",
            "name": "What is a good macro split?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A balanced 30 percent protein, 40 percent carbohydrate, 30 percent fat works for most people. Higher protein or a per-kilogram protein target helps keep muscle in a calorie deficit; lower-carb and keto shift energy toward fat."
            }
          },
          {
            "@type": "Question",
            "name": "How much protein per kilogram of body weight?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Common recommendations are 1.6 to 2.2 grams per kilogram per day for people who train, with the higher end during a calorie deficit."
            }
          },
          {
            "@type": "Question",
            "name": "Is this medical advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It is an estimate using standard formulas. Individual needs vary. Speak to a doctor or registered dietitian before making significant dietary changes, particularly with a health condition, during pregnancy, or for a child."
            }
          }
        ]
      }
    </script>
